<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title"><title id="title">Designed inbox surface with clear content hierarchy, source context and no dashboard chrome</title><defs>
<linearGradient id="porcelain" x1="0" y1="0" x2=".45" y2="1"><stop stop-color="#eef1ef"/><stop offset=".5" stop-color="#cbd3d5"/><stop offset="1" stop-color="#8f9da6"/></linearGradient>
<linearGradient id="nickel" x2="1" y2=".25"><stop stop-color="#263643"/><stop offset=".14" stop-color="#b0bdc6"/><stop offset=".2" stop-color="#5d6f7a"/><stop offset=".52" stop-color="#d4dfe2"/><stop offset=".58" stop-color="#6c7e88"/><stop offset="1" stop-color="#253645"/></linearGradient>
<linearGradient id="recess" x2=".1" y2="1"><stop stop-color="#030a11"/><stop offset=".13" stop-color="#0b1824"/><stop offset="1" stop-color="#172b39"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42535e"/><stop offset=".18" stop-color="#182c3a"/><stop offset=".65" stop-color="#0b1824"/><stop offset="1" stop-color="#203541"/></linearGradient>
<linearGradient id="paper" x2=".2" y2="1"><stop stop-color="#f0f1e8"/><stop offset="1" stop-color="#c7d0ce"/></linearGradient>
<linearGradient id="signal" x2="1" y2="1"><stop stop-color="#fff0d3"/><stop offset=".4" stop-color="#e6ba78"/><stop offset="1" stop-color="#ac7346"/></linearGradient>
<pattern id="fin" width="12" height="8" patternUnits="userSpaceOnUse"><path d="M0 1H12" stroke="#080e16" stroke-width="3"/><path d="M0 4H12" stroke="#7b8d97" stroke-width="1"/></pattern>
<pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#03101a"/><circle cx="8" cy="8" r="1.4" fill="#03101a"/></pattern>
</defs>
<rect x="0" y="0" width="1200" height="800" rx="22" fill="url(#nickel)"/><rect x="4" y="4" width="1192" height="792" rx="20" fill="#091722"/><rect x="7" y="7" width="1186" height="786" rx="18" fill="url(#glass)"/><text x="65" y="86" fill="#a8bec6" font-family="Arial,sans-serif" font-weight="400" font-size="24" letter-spacing="4">CORRESPONDENCE</text><circle cx="82" cy="177" r="4" fill="#bdcbd0"/><text x="115" y="190" fill="#c4d6da" font-family="Arial,sans-serif" font-weight="400" font-size="38" letter-spacing="0">A decision to make</text><path d="M115 231H1120" fill="none" stroke="#345569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="82" cy="317" r="4" fill="#bdcbd0"/><text x="115" y="330" fill="#c4d6da" font-family="Arial,sans-serif" font-weight="400" font-size="38" letter-spacing="0">The context behind it</text><path d="M115 371H1120" fill="none" stroke="#345569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="82" cy="457" r="4" fill="#bdcbd0"/><text x="115" y="470" fill="#c4d6da" font-family="Arial,sans-serif" font-weight="400" font-size="38" letter-spacing="0">A useful reply</text><path d="M115 511H1120" fill="none" stroke="#345569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="82" cy="597" r="4" fill="#bdcbd0"/><text x="115" y="610" fill="#c4d6da" font-family="Arial,sans-serif" font-weight="400" font-size="38" letter-spacing="0">A clear next step</text><path d="M115 651H1120" fill="none" stroke="#345569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
