<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000" role="img" aria-labelledby="title"><title id="title">Purpose-designed operating surface: intent and source material become a checked action, without dashboard decoration</title><defs>
<linearGradient id="porcelain" x1="0" y1="0" x2=".45" y2="1"><stop stop-color="#eef1ef"/><stop offset=".5" stop-color="#cbd3d5"/><stop offset="1" stop-color="#8f9da6"/></linearGradient>
<linearGradient id="nickel" x2="1" y2=".25"><stop stop-color="#263643"/><stop offset=".14" stop-color="#b0bdc6"/><stop offset=".2" stop-color="#5d6f7a"/><stop offset=".52" stop-color="#d4dfe2"/><stop offset=".58" stop-color="#6c7e88"/><stop offset="1" stop-color="#253645"/></linearGradient>
<linearGradient id="recess" x2=".1" y2="1"><stop stop-color="#030a11"/><stop offset=".13" stop-color="#0b1824"/><stop offset="1" stop-color="#172b39"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42535e"/><stop offset=".18" stop-color="#182c3a"/><stop offset=".65" stop-color="#0b1824"/><stop offset="1" stop-color="#203541"/></linearGradient>
<linearGradient id="paper" x2=".2" y2="1"><stop stop-color="#f0f1e8"/><stop offset="1" stop-color="#c7d0ce"/></linearGradient>
<linearGradient id="signal" x2="1" y2="1"><stop stop-color="#fff0d3"/><stop offset=".4" stop-color="#e6ba78"/><stop offset="1" stop-color="#ac7346"/></linearGradient>
<pattern id="fin" width="12" height="8" patternUnits="userSpaceOnUse"><path d="M0 1H12" stroke="#080e16" stroke-width="3"/><path d="M0 4H12" stroke="#7b8d97" stroke-width="1"/></pattern>
<pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#03101a"/><circle cx="8" cy="8" r="1.4" fill="#03101a"/></pattern>
</defs>
<rect x="0" y="0" width="1440" height="1000" rx="22" fill="url(#nickel)"/><rect x="4" y="4" width="1432" height="992" rx="20" fill="#091722"/><rect x="7" y="7" width="1426" height="986" rx="18" fill="url(#glass)"/><text x="80" y="94" fill="#dce4e4" font-family="Arial,sans-serif" font-weight="400" font-size="28" letter-spacing="5">WORK SURFACE</text><path d="M80 125H1360" fill="none" stroke="#6d828d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="191" fill="#94aab5" font-family="Arial,sans-serif" font-weight="400" font-size="18" letter-spacing="3">UNDERSTAND</text><text x="790" y="191" fill="#94aab5" font-family="Arial,sans-serif" font-weight="400" font-size="18" letter-spacing="3">ACT</text><rect x="84" y="234" width="502" height="636" rx="10" fill="url(#paper)"/><rect x="84" y="234" width="502" height="24" rx="8" fill="#9daeb6"/><text x="124" y="319" fill="#213f50" font-family="Arial,sans-serif" font-weight="400" font-size="38" letter-spacing="0">A clear intent.</text><text x="124" y="366" fill="#526d78" font-family="Arial,sans-serif" font-weight="400" font-size="21" letter-spacing="0">With the context beside it.</text><rect x="124" y="423" width="332" height="6" rx="3" fill="#91a5ab"/><rect x="124" y="459" width="360" height="6" rx="3" fill="#91a5ab"/><rect x="124" y="495" width="312" height="6" rx="3" fill="#91a5ab"/><rect x="124" y="531" width="350" height="6" rx="3" fill="#91a5ab"/><rect x="124" y="626" width="420" height="1" rx="0" fill="#a5b5b8"/><text x="124" y="678" fill="#526e79" font-family="Arial,sans-serif" font-weight="400" font-size="16" letter-spacing="2">SOURCE ATTACHED</text><path d="M124 725l12 12 22 -24" fill="none" stroke="#587a7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="174" y="739" fill="#274c5c" font-family="Arial,sans-serif" font-weight="400" font-size="23" letter-spacing="0">Context checked</text><rect x="790" y="234" width="566" height="306" rx="18" fill="#071822"/><text x="834" y="296" fill="#e3e9e7" font-family="Arial,sans-serif" font-weight="400" font-size="35" letter-spacing="0">A useful next step.</text><path d="M834 349H1283 M834 383H1220 M834 417H1255" fill="none" stroke="#738e9b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="834" y="466" width="246" height="5" rx="2" fill="url(#signal)"/><rect x="790" y="577" width="566" height="293" rx="18" fill="#0b1d2a"/><text x="834" y="638" fill="#c8d9df" font-family="Arial,sans-serif" font-weight="400" font-size="27" letter-spacing="0">Before it acts</text><circle cx="842" cy="685" r="3" fill="#b9c9c9"/><text x="864" y="690" fill="#8fa8b3" font-family="Arial,sans-serif" font-weight="400" font-size="21" letter-spacing="0">Permission</text><circle cx="842" cy="742" r="3" fill="#b9c9c9"/><text x="864" y="747" fill="#8fa8b3" font-family="Arial,sans-serif" font-weight="400" font-size="21" letter-spacing="0">A clear stopping point</text><circle cx="842" cy="799" r="3" fill="#b9c9c9"/><text x="864" y="804" fill="#8fa8b3" font-family="Arial,sans-serif" font-weight="400" font-size="21" letter-spacing="0">A person when needed</text><path d="M586 540H690V386H790" fill="none" stroke="#7b929f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="690" cy="540" r="8" fill="#b9cbd0"/><text x="80" y="946" fill="#829ca8" font-family="Arial,sans-serif" font-weight="400" font-size="16" letter-spacing="3">INFORMATION   /   SOFTWARE   /   PEOPLE</text>
</svg>
