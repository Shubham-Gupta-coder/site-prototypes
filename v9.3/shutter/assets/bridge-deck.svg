<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" width="1600" height="300" role="img" aria-labelledby="title"><title id="title">Folded nickel linking deck with a recessed cable bus and precise ventilation channels</title><defs>
